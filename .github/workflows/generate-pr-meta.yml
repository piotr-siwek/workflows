name: Generate PR Title and Description

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  generate-pr-meta:
    runs-on: ubuntu-latest
    outputs:
      pr_title: ${{ steps.parse.outputs.pr_title }}
      pr_description: ${{ steps.parse.outputs.pr_description }}
    steps:
      - name: Get branch name
        id: branch
        run: echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      - name: Parse branch name
        id: parse
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          
          # Wyciągnij numer i opis z feature/123-opis-czegos
          NUMBER=$(echo "$BRANCH" | sed -E 's#^[^/]+/([0-9]+).*#\1#')
          RAW_TITLE=$(echo "$BRANCH" | sed -E 's#^[^/]+/[0-9]+-(.*)$#\1#')
          
          # Zamiana myślników na spacje + kapitalizacja
          TITLE=$(echo "$RAW_TITLE" | sed -E 's/-/ /g' | sed -E 's/\b(.)/\U\1/g')

          echo "pr_title=$TITLE" >> $GITHUB_OUTPUT
          echo "pr_description=Powiązane zadanie: $NUMBER" >> $GITHUB_OUTPUT
      - name: Update Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            const title = "${{ steps.parse.outputs.pr_title }}";
            const body = "${{ steps.parse.outputs.pr_description }}";
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              title: title,
              body: body
            });
