name: Generate PR Title and Description

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  generate-pr-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Parse branch name
        id: parse
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          echo "Branch name: $BRANCH"

          # Format: feature/ph-123_cos-ciekawego
          TASK_NUMBER=$(echo "$BRANCH" | sed -E 's#^[^/]+/([^_]+)_.*#\1#')
          RAW_TITLE=$(echo "$BRANCH" | sed -E 's#^[^/]+/[^_]+_(.*)$#\1#')

          echo "Task number: $TASK_NUMBER"
          echo "Raw title: $RAW_TITLE"

          TASK_NUMBER_UPPER=$(echo "$TASK_NUMBER" | tr '[:lower:]' '[:upper:]')
          TITLE_WORDS=$(echo "$RAW_TITLE" | sed -E 's/-/ /g' | sed -E 's/\b(.)/\U\1/g')

          PR_TITLE="[$TASK_NUMBER_UPPER] $TITLE_WORDS"
          PR_DESCRIPTION="https://google.com/$TASK_NUMBER"

          echo "Generated PR title: $PR_TITLE"
          echo "Generated PR description: $PR_DESCRIPTION"

          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "pr_description=$PR_DESCRIPTION" >> $GITHUB_OUTPUT
      - name: Update Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            const title = "${{ steps.parse.outputs.pr_title }}";
            const body = "${{ steps.parse.outputs.pr_description }}";

            console.log('PR number:', pr_number);
            console.log('New title:', title);
            console.log('New description:', body);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              title: title,
              body: body
            });

            console.log('PR updated successfully');
